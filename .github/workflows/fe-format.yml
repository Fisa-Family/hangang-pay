name: FE Format Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'hangang-pay-fe/**'

jobs:
  fe-format:
    name: FE Prettier + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hangang-pay-fe/package-lock.json

      - name: Install dependencies
        working-directory: hangang-pay-fe
        run: npm ci

      - name: Prettier + ESLint check
        working-directory: hangang-pay-fe
        run: npm run check
