name: Format Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  be-format:
    name: BE Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('hangang-pay-be/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Spotless check
        working-directory: hangang-pay-be
        run: ./gradlew spotlessCheck

  fe-format:
    name: FE Prettier + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hangang-pay-fe/package-lock.json

      - name: Install dependencies
        working-directory: hangang-pay-fe
        run: npm ci

      - name: Prettier + ESLint check
        working-directory: hangang-pay-fe
        run: npm run check
