name: BE CI

on:
  push:
    branches: [test]
    paths:
      - 'hangang-pay-be/**'
      - '.github/workflows/be-ci.yml'
  pull_request:
    branches: [test]
    paths:
      - 'hangang-pay-be/**'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang-pay-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon

  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hangang-pay-be
          tags: |
            type=raw,value=test-latest
            type=sha,prefix=test-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: hangang-pay-be
          file: hangang-pay-be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
