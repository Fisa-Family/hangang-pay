name: BE Format Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'hangang-pay-be/**'

jobs:
  be-format:
    name: BE Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('hangang-pay-be/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Spotless check
        working-directory: hangang-pay-be
        run: ./gradlew spotlessCheck
