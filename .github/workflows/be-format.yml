name: BE Format Check

on:
  pull_request:
    branches: [main, dev, test]
    paths:
      - "hangang-pay-be/**"
      - ".github/workflows/be-format.yml"

permissions:
  contents: read

jobs:
  be-format:
    name: BE Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle permission
        working-directory: hangang-pay-be
        run: chmod +x ./gradlew

      - name: Spotless check
        working-directory: hangang-pay-be
        run: ./gradlew spotlessCheck --no-daemon
