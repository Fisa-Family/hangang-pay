upstream besu_rpc {
    server ${NODE1_IP}:8545 max_fails=1 fail_timeout=${RPC_FAIL_TIMEOUT};
    server ${NODE2_IP}:8545 backup;
    server ${NODE3_IP}:8545 backup;
    server ${NODE4_IP}:8545 backup;
    keepalive ${RPC_KEEPALIVE};
}

server {
    listen 8545;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout ${RPC_CONNECT_TIMEOUT};
        proxy_send_timeout ${RPC_SEND_TIMEOUT};
        proxy_read_timeout ${RPC_READ_TIMEOUT};
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries ${RPC_NEXT_UPSTREAM_TRIES};
        proxy_pass http://besu_rpc;
    }
}
