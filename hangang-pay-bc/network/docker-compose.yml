services:
  node1: # Bank of Korea (BoK) — CBDC issuer
    image: hyperledger/besu:26.4.0
    container_name: besu-node1
    volumes:
      - ./node-1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    networks:
      besu-network:
        ipv4_address: 172.16.239.11

  node2: # Woori Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node2
    volumes:
      - ./node-2/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8547:8545"
      - "8548:8546"
      - "30304:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.12

  node3: # Shinhan Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node3
    volumes:
      - ./node-3/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8549:8545"
      - "8550:8546"
      - "30305:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.13

  node4: # Hana Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node4
    volumes:
      - ./node-4/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8551:8545"
      - "8552:8546"
      - "30306:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.14

  postgres:
    image: postgres:13
    container_name: blockscout-postgres
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-blockscout_prod}
    restart: unless-stopped
    healthcheck:
      # Use $$ to avoid docker-compose variable substitution at parse time
      # so the variables are expanded inside the container at runtime.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      besu-network:
        ipv4_address: 172.16.239.20

  blockscout:
    image: blockscout/blockscout:latest
    container_name: blockscout
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ETHEREUM_JSONRPC_HTTP_URL=${ETHEREUM_JSONRPC_HTTP_URL:-http://node1:8545}
      - MIX_ENV=${MIX_ENV:-prod}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - SERVER=${SERVER:-true}
      - PORT=${PORT:-4000}
    env_file:
      - ../.env
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.21

networks:
  besu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24
