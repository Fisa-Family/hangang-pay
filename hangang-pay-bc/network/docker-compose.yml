services:
  rpc-lb:
    image: nginx:alpine
    container_name: besu-rpc-lb
    command:
      - /bin/sh
      - -c
      - >
        export RPC_FAIL_TIMEOUT="$${RPC_FAIL_TIMEOUT:-5s}"
        RPC_KEEPALIVE="$${RPC_KEEPALIVE:-32}"
        RPC_CONNECT_TIMEOUT="$${RPC_CONNECT_TIMEOUT:-2s}"
        RPC_SEND_TIMEOUT="$${RPC_SEND_TIMEOUT:-30s}"
        RPC_READ_TIMEOUT="$${RPC_READ_TIMEOUT:-30s}"
        RPC_NEXT_UPSTREAM_TRIES="$${RPC_NEXT_UPSTREAM_TRIES:-4}";
        envsubst '$$NODE1_IP $$NODE2_IP $$NODE3_IP $$NODE4_IP $$RPC_FAIL_TIMEOUT $$RPC_KEEPALIVE $$RPC_CONNECT_TIMEOUT $$RPC_SEND_TIMEOUT $$RPC_READ_TIMEOUT $$RPC_NEXT_UPSTREAM_TRIES'
        < /etc/nginx/templates/default.conf.template
        > /etc/nginx/conf.d/default.conf
        && exec nginx -g 'daemon off;'
    ports:
      - "18545:8545"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      NODE1_IP: node1
      NODE2_IP: node2
      NODE3_IP: node3
      NODE4_IP: node4
    depends_on:
      - node1
      - node2
      - node3
      - node4
    networks:
      besu-network:
        ipv4_address: 172.16.239.20
    restart: unless-stopped

  node1: # Bank of Korea (BoK) — CBDC issuer
    image: hyperledger/besu:26.4.0
    container_name: besu-node1
    volumes:
      - ./node-1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-max-active-connections=300
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN,TXPOOL
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
    networks:
      besu-network:
        ipv4_address: 172.16.239.11

  node2: # Woori Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node2
    volumes:
      - ./node-2/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8547:8545"
      - "8548:8546"
      - "30304:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-max-active-connections=300
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN,TXPOOL
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.12

  node3: # Shinhan Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node3
    volumes:
      - ./node-3/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8549:8545"
      - "8550:8546"
      - "30305:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-max-active-connections=300
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN,TXPOOL
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
      - node1
    networks:
      besu-network:
        ipv4_address: 172.16.239.13

  node4: # Hana Bank
    image: hyperledger/besu:26.4.0
    container_name: besu-node4
    volumes:
      - ./node-4/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8551:8545"
      - "8552:8546"
      - "30306:30303"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-max-active-connections=300
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN,TXPOOL
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@172.16.239.11:30303
      - --logging=INFO
    depends_on:
