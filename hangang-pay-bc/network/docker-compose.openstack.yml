services:
  node1:
    image: hyperledger/besu:26.4.0
    container_name: besu-node1
    volumes:
      - ./node-1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303/tcp"
      - "30303:30303/udp"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=${NODE1_IP}
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO
      - --bonsai-historical-block-limit=5000
      - --rpc-http-max-active-connections=200

