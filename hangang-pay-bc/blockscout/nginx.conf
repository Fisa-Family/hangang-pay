server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:4000/api/;
    }

    location /socket/ {
        proxy_pass http://backend:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:3000/;
    }
}