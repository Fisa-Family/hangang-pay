services:

  postgres:
    image: postgres:17
    container_name: blockscout-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/blockscout/blockscout:latest
    container_name: blockscout-backend
    env_file:
      - .env
    command: >
      sh -c '/app/bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" &&
             /app/bin/blockscout start'
    depends_on:
      - postgres
    networks:
      - default
      - besu-network

  frontend:
    image: ghcr.io/blockscout/frontend:latest
    container_name: blockscout-frontend
    env_file:
      - .env

  proxy:
    image: nginx:alpine
    container_name: blockscout-proxy
    ports:
      - "4000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:

networks:
  besu-network:
    external: true
    name: network_default