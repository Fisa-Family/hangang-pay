# hangang-pay-be: 앱 + Alloy 사이드카
# 인스턴스마다 동일하게 기동(EC2 Blue/Green, 온프레 테스트). 환경 차이는 .env로만 흡수.
# start.sh가 SSM/IMDS로 .env를 생성한 뒤 `docker compose up -d`로 실행한다.

services:
  app:
    image: ${APP_IMAGE}
    container_name: app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345" # Alloy UI/health (선택)
    env_file:
      - .env
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app
