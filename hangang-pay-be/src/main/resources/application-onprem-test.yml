spring:
  data:
    redis:
      host: ${REDIS_HOST}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    root: WARN
  structured:
    format:
      console: ecs # stdout을 ECS JSON으로 → Alloy가 docker 로그로 수집 후 Loki push

# Sentry: 온프레 테스트 환경 식별 + 성능 트레이싱(테스트라 전량 샘플링)
sentry:
  environment: onprem-test
  traces-sample-rate: 1.0
  release: ${SENTRY_RELEASE:}

app:
  cors:
    allowed-origins:
      - https://hangang-pay.vercel.app
      - https://hangang-pay-sene03s-projects.vercel.app
