spring:
  application:
    name: hangang-pay

# Swagger (SpringDoc) : /swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs


# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

# CORS : CorsConfig.java에서 읽어서 목록에 채운다.
app:
  cors:
    allowed-origins: [] # 프로필 설정이 누락됐을 때 빈 목록으로 Fallback
