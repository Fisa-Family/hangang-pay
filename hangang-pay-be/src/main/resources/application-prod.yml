spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN

app:
  cors:
    allowed-origins:
      - # CloudFront 주소 확정 후 작성

blockchain:
  private-network:
    chain-id: 1337 # 트랜잭션 서명 시 사용하는 private blockchain 네트워크 식별자