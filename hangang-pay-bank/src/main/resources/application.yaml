spring:
  profiles:
    active: local
  application:
    name: hangang-pay-bank
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info

wallet:
  key-cipher:
    secret: ${WALLET_KEY_CIPHER_SECRET:dev-secret-please-change-in-production}

blockchain:
  private-network:
    chain-id: 1337

mq:
  provider: rabbit

outbox:
  publisher:
    delay-ms: 5000ms
