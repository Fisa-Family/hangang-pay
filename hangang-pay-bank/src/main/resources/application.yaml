spring:
  profiles:
    active: local
  application:
    name: hangang-pay-bank
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

# Sentry (에러 추적 + 성능 트레이싱)
# DSN은 환경변수로 주입. 미설정 시(local/dev) Sentry 비활성
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false # 개인정보 비전송
  logging:
    minimum-event-level: warn # WARN 이상을 Sentry 이벤트로 전송
    minimum-breadcrumb-level: info

wallet:
  key-cipher:
    secret: ${WALLET_KEY_CIPHER_SECRET:dev-secret-please-change-in-production}

# hangang-pay-be가 보내는 X-Bank-Api-Key 헤더 검증값
# BE와 동일한 값으로 설정
bank:
  api-key: ${BANK_API_KEY:hangang-pay-local-bank-api-key}

blockchain:
  private-network:
    chain-id: 1337

mq:
  provider: rabbit

outbox:
  publisher:
    delay-ms: 5000ms
