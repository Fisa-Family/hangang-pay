spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: ecs                          # stdout을 ECS JSON으로 → Alloy가 docker 로그로 수집 후 Loki push

# Sentry: 운영 환경 식별 + 성능 트레이싱 샘플링
sentry:
  environment: prod
  traces-sample-rate: 0.2
  release: ${SENTRY_RELEASE:}
