spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    root: WARN
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: ERROR
