spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

blockchain:
  rpc-endpoint:
    bok: http://10.10.1.91:18545
    wr: http://10.10.1.91:18545
    sh: http://10.10.1.91:18545
    hn: http://10.10.1.91:18545

logging:
  level:
    family.fisa.hangangpay: INFO
  structured:
    format:
      console: ecs # stdout을 ECS JSON으로 → Alloy가 docker 로그로 수집 후 Loki push

# Sentry: 온프레 환경 식별 + 성능 트레이싱
sentry:
  environment: onprem-test
  traces-sample-rate: 1.0
  release: ${SENTRY_RELEASE:}
